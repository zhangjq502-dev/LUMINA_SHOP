name: Code checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: lumina
          POSTGRES_PASSWORD: lumina_ci
          POSTGRES_DB: lumina_shop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumina -d lumina_shop"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://lumina:lumina_ci@localhost:5432/lumina_shop
      TEST_DATABASE_URL: postgresql://lumina:lumina_ci@localhost:5432/lumina_shop_test
      VITE_API_URL: http://localhost:4000/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build:api
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
